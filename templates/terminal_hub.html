<!doctype html>
<html data-theme="{{ dashboard_theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Terminal — Cadre</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='cadre-logo.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='cadre-logo.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16171a">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}">
<script>window.addEventListener('pageshow', (e) => { if (e.persisted) window.location.reload(); });</script>
<script src="{{ url_for('static', filename='theme-effects.js') }}?v={{ asset_version }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/xterm.css') }}">
<style>
  /* Hard backstop, not just a fix for the one known cause above --
     nothing on this page should ever be able to force a horizontal
     scrollbar on the whole app shell, regardless of what overflows
     inside it. */
  html, body { height: 100%; overflow-x: hidden; }
  body { max-width: none; padding: 0; display: flex; }
  .term-sidebar {
    width: 230px; flex-shrink: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--border-soft); overflow-y: auto;
  }
  .term-sidebar-header {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.7rem 0.8rem; border-bottom: 1px solid var(--border-soft); flex-shrink: 0;
  }
  .term-sidebar-header span { font-size: 0.88rem; font-weight: 600; }
  .term-stack-header {
    display: flex; align-items: center; gap: 0.4rem; cursor: pointer;
    padding: 0.55rem 0.8rem; font-size: 0.8rem; font-weight: 600; color: var(--text-dim);
    border-bottom: 1px solid var(--border-soft); user-select: none;
  }
  .term-stack-header:hover { color: var(--text); background: var(--surface-2); }
  .term-stack-header .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .term-stack-chevron { flex-shrink: 0; width: 14px; height: 14px; transition: transform 0.12s ease; }
  .term-stack-count {
    flex-shrink: 0; font-size: 0.72rem; font-weight: 500; color: var(--text-faint);
    background: var(--surface-2); border-radius: 999px; padding: 0.05rem 0.45rem;
  }
  .term-stack-group.collapsed .term-stack-chevron { transform: rotate(-90deg); }
  .term-stack-group.collapsed .term-stack-sessions { display: none; }
  .term-session-row {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.65rem 0.8rem; cursor: pointer; font-size: 0.84rem;
    border-bottom: 1px solid var(--border-soft); border-left: 3px solid transparent;
    transition: background 0.1s ease;
  }
  .term-session-row:hover { background: var(--surface-2); }
  .term-session-row.active { background: var(--accent-soft-bg); border-left-color: var(--accent); }
  .term-session-row .status-dot { flex-shrink: 0; }
  .term-session-row .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .term-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .term-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.5rem 0.9rem; border-bottom: 1px solid var(--border-soft); flex-shrink: 0;
    gap: 0.6rem; position: relative;
  }
  /* Absolutely positioned against the header itself, not flex:1'd into
     the leftover space next to the controls -- that only centers within
     whatever's left after the left-side group, which drifts off the
     page's actual center depending on how wide that group is. This
     centers on the real midpoint of the header every time -- but on a
     narrow window the left-side controls group can extend past that
     midpoint itself, and absolute positioning has no awareness of
     siblings to avoid, so it'll happily render right on top of them.
     Falls back to normal flow (no true centering, but never
     overlapping) below a width where that's a real risk. */
  .term-header .label {
    font-size: 0.9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    position: absolute; left: 50%; transform: translateX(-50%);
    max-width: 40%; pointer-events: none;
  }
  @media (max-width: 760px) {
    .term-header .label {
      position: static; transform: none; flex: 1; max-width: none; text-align: right;
    }
  }
  .term-header .term-status { font-size: 0.76rem; color: var(--text-faint); flex-shrink: 0; }
  .term-header-actions { display: none; flex-shrink: 0; }
  /* min-width:0 + overflow:hidden on both -- without them, a flex
     child defaults to never shrinking below its content's intrinsic
     width, and xterm.js sets its own inner canvas width in pixels
     based on its column count. If that ever computes wider than the
     actual panel (e.g. a fit that ran before layout fully settled),
     the flex child would just grow to fit it instead of clipping,
     dragging the whole page into horizontal scroll. */
  /* Capped and centered rather than stretching edge-to-edge -- a wide
     panel with narrower content inside it (either because the window is
     huge, or because older scrollback is stuck at whatever width it was
     originally written for) just reads as a big block of empty
     background past wherever the actual text stops. */
  #terminal-wrap { flex: 1; min-height: 0; min-width: 0; max-width: 1300px; margin: 0 auto; width: 100%; overflow: hidden; background: #000; padding: 0.4rem; display: none; flex-direction: column; }
  #terminal { flex: 1; min-height: 0; min-width: 0; overflow: hidden; }
  #term-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 0.88rem; text-align: center; padding: 2rem; }
  #term-not-running {
    flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.8rem; color: var(--text-dim); font-size: 0.88rem; text-align: center; padding: 2rem;
  }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .status-on { background: var(--success-text); }
  .status-off { background: var(--text-faint); }
</style>
</head>
<body>
  <div class="term-sidebar">
    <div class="term-sidebar-header">
      <a class="btn btn-icon" href="{{ url_for('index') }}" title="Dashboard" aria-label="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
      <span>Sessions</span>
    </div>
    <div id="session-list">
      {% for group in stack_groups %}
      <div class="term-stack-group" data-stack-name="{{ group.stack.name }}">
        <div class="term-stack-header" onclick="toggleStackGroup(this)">
          <svg class="term-stack-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          <span class="label">{{ group.stack.name }}</span>
          <span class="term-stack-count">{{ group.sessions|length }}</span>
        </div>
        <div class="term-stack-sessions">
          {% for s in group.sessions %}
          <div class="term-session-row" data-session-id="{{ s.id }}" data-label="{{ s.label }}" onclick="selectSession('{{ s.id }}')">
            <span class="status-dot {{ 'status-on' if s.status.running else 'status-off' }}" id="dot-{{ s.id }}"></span>
            <span class="label">{{ s.label }}</span>
          </div>
          {% else %}
          <p class="hint" style="padding:0.5rem 0.8rem;">No sessions yet.</p>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>

  <div class="term-main">
    <div class="term-header">
      <div class="term-header-actions btn-group" id="term-header-actions">
        <button class="btn btn-icon" title="Start" aria-label="Start" onclick="sessionAction('start')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="btn btn-icon" title="Stop" aria-label="Stop" onclick="sessionAction('stop')"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
        <button class="btn btn-icon btn-primary" title="Restart" aria-label="Restart" onclick="sessionAction('restart')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg></button>
      </div>
      <select class="btn" id="terminal-theme-select" title="Terminal theme (applies to every session)" onchange="saveTerminalTheme(this.value)" style="flex-shrink:0; width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
        {% for value, label in terminal_theme_options %}
        <option value="{{ value }}" {{ 'selected' if value == terminal_theme else '' }}>{{ label }}</option>
        {% endfor %}
      </select>
      <span class="term-status" id="term-status"></span>
      <span class="label" id="term-active-label">Pick a session</span>
    </div>
    <div id="terminal-wrap"><div id="terminal"></div></div>
    <div id="term-not-running">
      <p>This session isn't running.</p>
      <button class="btn btn-primary" onclick="sessionAction('start')">Start it</button>
    </div>
    <div id="term-empty">Pick a session from the left to open its terminal.</div>
  </div>

<script src="{{ url_for('static', filename='vendor/xterm.js') }}?v={{ asset_version }}"></script>
<script src="{{ url_for('static', filename='vendor/xterm-addon-fit.js') }}?v={{ asset_version }}"></script>
<script src="{{ url_for('static', filename='terminal.js') }}?v={{ asset_version }}"></script>
<script>
const LAST_SESSION_KEY = "cadre_last_terminal_session";
const COLLAPSED_STACKS_KEY = "cadre_collapsed_terminal_stacks";
const CSRF_TOKEN = "{{ csrf_token() }}";

function toggleStackGroup(headerEl) {
  const group = headerEl.closest(".term-stack-group");
  const name = group.dataset.stackName;
  group.classList.toggle("collapsed");

  const collapsed = new Set(JSON.parse(localStorage.getItem(COLLAPSED_STACKS_KEY) || "[]"));
  if (group.classList.contains("collapsed")) collapsed.add(name);
  else collapsed.delete(name);
  localStorage.setItem(COLLAPSED_STACKS_KEY, JSON.stringify([...collapsed]));
}

// Restore each stack group's collapsed/expanded state from last visit --
// defaults to expanded (nothing hidden) the first time, same as the
// theme dropdowns default to whatever's actually saved rather than a
// blank slate.
(function () {
  const collapsed = new Set(JSON.parse(localStorage.getItem(COLLAPSED_STACKS_KEY) || "[]"));
  document.querySelectorAll(".term-stack-group").forEach((group) => {
    if (collapsed.has(group.dataset.stackName)) group.classList.add("collapsed");
  });
})();
let term = null;
let fitAddon = null;
let connection = null;
let activeId = null;
let notRunning = false;
let pollTimer = null;

function showNotRunning() {
  notRunning = true;
  document.getElementById("terminal-wrap").style.display = "none";
  document.getElementById("term-not-running").style.display = "flex";
}

function hideNotRunning() {
  notRunning = false;
  document.getElementById("terminal-wrap").style.display = "flex";
  document.getElementById("term-not-running").style.display = "none";
}

function selectSession(id) {
  const row = document.querySelector('.term-session-row[data-session-id="' + id + '"]');
  if (!row) return;

  document.querySelectorAll(".term-session-row").forEach(el => el.classList.remove("active"));
  row.classList.add("active");
  document.getElementById("term-active-label").textContent = row.dataset.label;
  document.getElementById("term-empty").style.display = "none";
  document.getElementById("term-header-actions").style.display = "flex";
  hideNotRunning();

  activeId = id;
  localStorage.setItem(LAST_SESSION_KEY, id);
  const url = new URL(window.location);
  url.searchParams.set("session", id);
  history.replaceState(null, "", url);

  if (connection) connection.close();

  if (!term) {
    const initialTheme = resolveXtermTheme("{{ terminal_theme }}");
    term = new Terminal({ convertEol: true, fontSize: 13, theme: initialTheme });
    term.open(document.getElementById("terminal"));
    syncTerminalWrapperBackground("terminal-wrap", initialTheme);
    fitAddon = setupTerminalFit(term);
  }

  const statusEl = document.getElementById("term-status");
  connection = createTerminalConnection(id, {
    tokenUrl: "/sessions/" + id + "/terminal-token",
    csrfToken: CSRF_TOKEN,
    term: term,
    onStatus: (text) => {
      statusEl.textContent = text;
      // A second fit once real content starts flowing -- covers the
      // case where the container's size settled differently than it
      // was when setupTerminalFit's own deferred fit ran (e.g. switching
      // sessions right after the page loaded).
      if (text === "connected" && fitAddon) fitAddon.fit();
    },
    onNotRunning: () => { if (activeId === id) showNotRunning(); },
  });
  if (!document.querySelector(".term-key-row")) {
    attachMobileKeyRow(document.getElementById("terminal-wrap"), {
      send: (data) => { if (connection) connection.send(data); },
    });
  }

  startPolling();
}

async function sessionAction(action) {
  if (!activeId) return;
  await fetch("/sessions/" + activeId + "/" + action, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: "csrf_token=" + encodeURIComponent(CSRF_TOKEN),
  });
  // start/restart need a moment for the daemon to actually spawn the
  // pty before a new websocket connection can succeed against it.
  setTimeout(() => { if (activeId) selectSession(activeId); }, 1200);
}

async function saveTerminalTheme(choice) {
  const select = document.getElementById("terminal-theme-select");
  select.disabled = true;
  try {
    const res = await fetch("/settings/terminal-theme", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "terminal_theme=" + encodeURIComponent(choice) + "&csrf_token=" + encodeURIComponent(CSRF_TOKEN),
    });
    const data = await res.json();
    // Rewrites config on disk immediately; a session that's already
    // running read its config at startup though, so this alone won't
    // change what's on screen until it's restarted. The xterm.js colors
    // themselves are a separate thing we fully control ourselves though
    // (not the CLI's config) -- update those live, right now.
    if (term) {
      const newTheme = resolveXtermTheme(choice);
      term.options.theme = newTheme;
      syncTerminalWrapperBackground("terminal-wrap", newTheme);
    }
    select.title = data.ok
      ? "Terminal theme (applied to " + data.applied + " session(s) -- already-running ones need a restart to pick it up)"
      : "Terminal theme (save failed)";
  } catch (e) {
    select.title = "Terminal theme (save failed)";
  }
  select.disabled = false;
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (!activeId) return;
    try {
      const res = await fetch("/sessions/" + activeId + "/status.json");
      const data = await res.json();
      const dot = document.getElementById("dot-" + activeId);
      if (dot) dot.className = "status-dot " + (data.running ? "status-on" : "status-off");
      // The session came up (started elsewhere, or our own Start
      // finished) while we were showing "not running" -- reconnect.
      if (notRunning && data.running) selectSession(activeId);
    } catch (e) { /* ignore */ }
  }, 3000);
}

const urlParams = new URLSearchParams(window.location.search);
const requested = urlParams.get("session") || localStorage.getItem(LAST_SESSION_KEY);
if (requested && document.querySelector('.term-session-row[data-session-id="' + requested + '"]')) {
  selectSession(requested);
}
</script>
</body>
</html>
