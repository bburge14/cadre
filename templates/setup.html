<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Set up — Cadre</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='cadre-logo.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  body { max-width: 420px; padding-top: 4rem; }
  .btn { width: 100%; margin-top: 1.3rem; justify-content: center; }
</style>
</head>
<body>
  <h1 class="brand" style="font-size:1.3rem;"><img src="{{ url_for('static', filename='cadre-logo.png') }}" alt="" width="32" height="32">Welcome to Cadre — create your admin account</h1>
  <p class="sub">This is a one-time step. Whoever creates this account is the only person who can log into this instance.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="post" action="{{ url_for('setup') }}">
    <label>username</label>
    <input name="username" required autofocus>
    <label>password <span class="hint">(at least 8 characters)</span></label>
    <input name="password" type="password" required minlength="8">
    <label>confirm password</label>
    <input name="confirm" type="password" required minlength="8">
    <button class="btn btn-primary" type="submit">Create account</button>
  </form>
</body>
</html>
