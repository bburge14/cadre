<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>{{ session.label }} — terminal — Cadre</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='cadre-logo.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='cadre-logo.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ session.label }}">
<meta name="theme-color" content="#16171a">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/xterm.css') }}">
<style>
  html, body { height: 100%; }
  body { max-width: none; padding: 0; display: flex; flex-direction: column; }
  .term-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }
  .term-header .label { font-size: 0.9rem; font-weight: 600; }
  .term-header .term-status { font-size: 0.76rem; color: var(--text-faint); }
  #terminal-wrap { flex: 1; min-height: 0; background: #000; padding: 0.4rem; display: flex; flex-direction: column; }
  #terminal { flex: 1; min-height: 0; }
</style>
</head>
<body>
  <div class="term-header">
    <a class="btn btn-icon" href="{{ url_for('session_detail', session_id=session.id) }}" title="Back to session" aria-label="Back to session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <span class="label">{{ session.label }}</span>
    <span class="term-status" id="term-status">connecting…</span>
  </div>

  <div id="terminal-wrap">
    <div id="terminal"></div>
  </div>

<script src="{{ url_for('static', filename='vendor/xterm.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/xterm-addon-fit.js') }}"></script>
<script src="{{ url_for('static', filename='terminal.js') }}"></script>
<script>
const term = new Terminal({ convertEol: true, fontSize: 14, theme: { background: "#000000" } });
term.open(document.getElementById("terminal"));
setupTerminalFit(term);

const statusEl = document.getElementById("term-status");
const connection = createTerminalConnection("{{ session.id }}", {
  tokenUrl: "{{ url_for('session_terminal_token', session_id=session.id) }}",
  csrfToken: "{{ csrf_token() }}",
  term: term,
  onStatus: (text) => { statusEl.textContent = text; },
});
attachMobileKeyRow(document.getElementById("terminal-wrap"), connection);

window.addEventListener("beforeunload", () => connection.close());
</script>
</body>
</html>
