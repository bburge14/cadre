<!doctype html>
<html data-theme="{{ dashboard_theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>{{ session.label }} — terminal — Cadre</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='cadre-logo.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='cadre-logo.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ session.label }}">
<meta name="theme-color" content="#16171a">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}">
<script>window.addEventListener('pageshow', (e) => { if (e.persisted) window.location.reload(); });</script>
<script src="{{ url_for('static', filename='theme-effects.js') }}?v={{ asset_version }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/xterm.css') }}">
<style>
  /* Hard backstop, not just a fix for the one known cause above --
     nothing on this page should ever be able to force a horizontal
     scrollbar on the whole app shell, regardless of what overflows
     inside it. */
  html, body { height: 100%; overflow-x: hidden; }
  /* The shared body{} scrim/rounded-card treatment (style.css) is meant
     for a centered content column with page background showing at its
     margins -- this page is deliberately edge-to-edge, so undo the
     parts that would look broken full-bleed (rounded corners cut into
     the viewport, a floating shadow) while keeping the scrim itself,
     since a real xterm background already sits opaquely on top of it. */
  body { max-width: none; padding: 0; display: flex; flex-direction: column; border-radius: 0; box-shadow: none; }
  /* Grid, not flex + absolute positioning -- the previous approach
     (absolutely centering the title against the header) had no idea how
     wide the left-side controls actually were, so at plenty of ordinary
     desktop widths the title just rendered on top of them; a media-
     query breakpoint was a guess at a threshold, not a real fix, and
     didn't cover the actual overlap range. A 1fr/auto/1fr grid can't
     overlap by construction: the left and right columns always claim
     equal space no matter the title's width, and the title's own column
     is sized to its content and never shares space with anything else. */
  .term-header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0.5rem 0.9rem; border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0; gap: 0.6rem;
  }
  .term-header-left { display: flex; align-items: center; gap: 0.6rem; min-width: 0; overflow: hidden; }
  .term-header-right { display: flex; align-items: center; gap: 0.3rem; justify-content: flex-end; flex-wrap: wrap; }
  .term-header .label {
    font-size: 0.9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: center; max-width: 100%;
  }
  .term-header .term-status { font-size: 0.76rem; color: var(--text-faint); flex-shrink: 0; }
  /* min-width:0 + overflow:hidden on both -- without them, a flex
     child defaults to never shrinking below its content's intrinsic
     width, and xterm.js sets its own inner canvas width in pixels
     based on its column count. If that ever computes wider than the
     actual panel (e.g. a fit that ran before layout fully settled),
     the flex child would just grow to fit it instead of clipping,
     dragging the whole page into horizontal scroll. */
  /* Capped and centered rather than stretching edge-to-edge -- a wide
     panel with narrower content inside it (either because the window is
     huge, or because older scrollback is stuck at whatever width it was
     originally written for) just reads as a big block of empty
     background past wherever the actual text stops. */
  /* No max-width here on purpose -- static/terminal.js's own three-tier
     column snapping (TERMINAL_COL_TIERS) is what actually caps how wide
     the terminal gets now, deliberately, so it can reach its own "large"
     tier on a genuinely wide screen; a separate, smaller CSS cap here
     would just fight that and silently keep every screen stuck on a
     lower tier than it should reach. */
  #terminal-wrap { flex: 1; min-height: 0; min-width: 0; margin: 0 auto; width: 100%; overflow: hidden; background: #000; padding: 0.4rem; display: flex; flex-direction: column; }
  #terminal { flex: 1; min-height: 0; min-width: 0; overflow: hidden; }
  #term-not-running {
    flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.8rem; color: var(--text-dim); font-size: 0.88rem; text-align: center; padding: 2rem;
  }
</style>
</head>
<body>
  {% from '_topbar.html' import nav_icons, ai_status_widget %}
  <div class="term-header">
    <div class="term-header-left">
      <a class="btn btn-icon" href="{{ url_for('session_detail', session_id=session.id) }}" title="Back to session" aria-label="Back to session" onclick="if (history.length > 1) { history.back(); return false; }"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
      <div class="btn-group">
        <button class="btn btn-icon" title="Start" aria-label="Start" onclick="sessionAction('start')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="btn btn-icon" title="Stop" aria-label="Stop" onclick="sessionAction('stop')"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
        <button class="btn btn-icon btn-primary" title="Restart" aria-label="Restart" onclick="sessionAction('restart')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg></button>
        <button class="btn btn-icon btn-danger" title="Delete session" aria-label="Delete session" onclick="sessionAction('delete')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
      </div>
      <select class="btn" id="terminal-theme-select" title="Terminal theme (applies to every session)" onchange="saveTerminalTheme(this.value)" style="flex-shrink:0; width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
        {% for value, label in terminal_theme_options %}
        <option value="{{ value }}" {{ 'selected' if value == terminal_theme else '' }}>{{ label }}</option>
        {% endfor %}
      </select>
      <span class="term-status" id="term-status">connecting…</span>
    </div>
    <span class="label">{{ session.label }}</span>
    <div class="term-header-right">{{ ai_status_widget() }}{{ nav_icons(active='terminal') }}</div>
  </div>

  <div id="terminal-wrap">
    <div id="terminal"></div>
  </div>
  <div id="term-not-running">
    <p>This session isn't running.</p>
    <button class="btn btn-primary" onclick="sessionAction('start')">Start it</button>
  </div>

<script src="{{ url_for('static', filename='vendor/xterm.js') }}?v={{ asset_version }}"></script>
<script src="{{ url_for('static', filename='vendor/xterm-addon-fit.js') }}?v={{ asset_version }}"></script>
<script src="{{ url_for('static', filename='terminal.js') }}?v={{ asset_version }}"></script>
<script>
const SESSION_ID = "{{ session.id }}";
const CSRF_TOKEN = "{{ csrf_token() }}";
let fitAddon = null;
let connection = null;
let notRunning = false;
let pollTimer = null;

const initialTheme = resolveXtermTheme("{{ terminal_theme }}");
const term = new Terminal({ convertEol: true, fontSize: 14, theme: initialTheme });
term.open(document.getElementById("terminal"));
syncTerminalWrapperBackground("terminal-wrap", initialTheme);
fitAddon = setupTerminalFit(term);

function showNotRunning() {
  notRunning = true;
  document.getElementById("terminal-wrap").style.display = "none";
  document.getElementById("term-not-running").style.display = "flex";
}

function hideNotRunning() {
  notRunning = false;
  document.getElementById("terminal-wrap").style.display = "flex";
  document.getElementById("term-not-running").style.display = "none";
}

function connect() {
  hideNotRunning();
  const statusEl = document.getElementById("term-status");
  connection = createTerminalConnection(SESSION_ID, {
    tokenUrl: "{{ url_for('session_terminal_token', session_id=session.id) }}",
    csrfToken: CSRF_TOKEN,
    term: term,
    onStatus: (text) => {
      statusEl.textContent = text;
      if (text === "connected" && fitAddon) fitAddon.fit();
    },
    onNotRunning: showNotRunning,
  });
  if (!document.querySelector(".term-key-row")) {
    attachMobileKeyRow(document.getElementById("terminal-wrap"), {
      send: (data) => { if (connection) connection.send(data); },
    });
  }
}

async function sessionAction(action) {
  if (action === "delete") {
    if (!confirm("Delete this session? This stops it and removes it from the list.")) return;
  }
  // Same reasoning as terminal_hub.html's sessionAction -- this view
  // already knows its own real terminal size, so start/restart can
  // spawn the pty at that size directly instead of a generic guess.
  let sizeParams = "";
  if (term && (action === "start" || action === "restart")) {
    sizeParams = "&cols=" + term.cols + "&rows=" + term.rows;
  }
  await fetch("/sessions/" + SESSION_ID + "/" + action, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: "csrf_token=" + encodeURIComponent(CSRF_TOKEN) + sizeParams,
  });
  if (action === "delete") {
    window.location.href = "{{ url_for('terminal_hub') }}";
    return;
  }
  setTimeout(connect, 1200);
}

async function saveTerminalTheme(choice) {
  const select = document.getElementById("terminal-theme-select");
  select.disabled = true;
  try {
    const res = await fetch("/settings/terminal-theme", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "terminal_theme=" + encodeURIComponent(choice) + "&csrf_token=" + encodeURIComponent(CSRF_TOKEN),
    });
    const data = await res.json();
    // The CLI's own config needs a restart to pick up, but xterm.js's
    // colors are ours to control directly -- update those live, now.
    const newTheme = resolveXtermTheme(choice);
    term.options.theme = newTheme;
    syncTerminalWrapperBackground("terminal-wrap", newTheme);
    select.title = data.ok
      ? "Terminal theme (applied to " + data.applied + " session(s) -- already-running ones need a restart to pick it up)"
      : "Terminal theme (save failed)";
  } catch (e) {
    select.title = "Terminal theme (save failed)";
  }
  select.disabled = false;
}

pollTimer = setInterval(async () => {
  try {
    const res = await fetch("/sessions/" + SESSION_ID + "/status.json");
    const data = await res.json();
    if (notRunning && data.running) connect();
  } catch (e) { /* ignore */ }
}, 3000);

connect();
window.addEventListener("beforeunload", () => { if (connection) connection.close(); if (pollTimer) clearInterval(pollTimer); });
</script>
</body>
</html>
