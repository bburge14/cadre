<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{ 'Edit' if skill else 'New' }} skill — Cadre</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='cadre-logo.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  body { max-width: 760px; }
</style>
</head>
<body>
  <p style="margin-top:1.5rem;"><a class="btn" href="{{ back_url }}" onclick="if (history.length > 1) { history.back(); return false; }">&larr; {{ back_label }}</a></p>
  <h1>{{ 'Edit ' + name if skill else 'New skill' }}</h1>
  {% if not skill %}
  <p class="hint">Creates <code>&lt;skills-dir&gt;/&lt;name&gt;/SKILL.md</code> — a packaged set of instructions loaded into whatever session invokes it, not a separate spawned worker like an agent.</p>
  {% endif %}

  <form method="post" action="{{ save_action }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>name <span class="hint">(lowercase-hyphenated, e.g. pdf-fill — this is the folder name and can't be changed after creating; delete and recreate to rename)</span></label>
    <input name="name" value="{{ name if skill else '' }}" {{ 'disabled' if skill else '' }} {{ '' if skill else 'required' }}>

    <label>description <span class="hint">(what this skill does and when to use it — this is what Claude matches against to decide whether to load it)</span>
      <details class="help"><summary></summary><div class="help-body">
        <p>Be specific about <em>when</em> to use it, not just what it is — this is the only thing an agent sees before deciding to load the skill.</p>
        <p>Weak: "Helps with commits."</p>
        <p>Better: "Use when writing a git commit message — house style for subject line, body, and when to include a footer."</p>
      </div></details>
    </label>
    <input name="description" value="{{ skill.frontmatter.get('description', '') if skill else '' }}" required>

    <label>instructions (markdown body)
      <details class="help"><summary></summary><div class="help-body">
        <p>Written directly to whatever agent invokes this skill — plain instructions, not a spec. Keep it focused on one playbook rather than a general reference.</p>
        <p>Concrete beats abstract: a short example of the right output is usually worth more than a paragraph describing it.</p>
      </div></details>
    </label>
    <textarea name="body">{{ skill.body if skill else '' }}</textarea>

    <button class="btn btn-primary" type="submit" style="margin-top:1.2rem;">{{ 'Save' if skill else 'Create skill' }}</button>
  </form>
</body>
</html>
