<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Log in — Cadre</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='cadre-logo.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  body { max-width: 380px; padding-top: 4rem; }
  .btn { width: 100%; margin-top: 1.3rem; justify-content: center; }
</style>
</head>
<body>
  <h1 class="brand" style="font-size:1.3rem;"><img src="{{ url_for('static', filename='cadre-logo.png') }}" alt="" width="32" height="32">Cadre</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="post" action="{{ url_for('login') }}">
    <label>username</label>
    <input name="username" required autofocus>
    <label>password</label>
    <input name="password" type="password" required>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>

  <p class="hint" style="margin-top:1.2rem; text-align:center;">
    <a href="{{ url_for('forgot_password') }}">Forgot your password?</a>
  </p>
</body>
</html>
