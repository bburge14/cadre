<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Log in — Cadre</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='cadre-logo.png') }}">
<style>
  body { font-family: -apple-system, sans-serif; background: #1b1c1e; color: #e6e6e6; margin: 0 auto; padding: 4rem 2rem; max-width: 380px; }
  h1 { font-size: 1.15rem; }
  label { display: block; font-size: 0.82rem; color: #9a9a9a; margin: 1rem 0 0.3rem; }
  input { width: 100%; box-sizing: border-box; background: #232427; border: 1px solid #3a3b3e; color: #e6e6e6; border-radius: 6px; padding: 0.55rem 0.6rem; font-size: 0.9rem; font-family: inherit; }
  .btn { width: 100%; padding: 0.55rem 1rem; border-radius: 5px; font-size: 0.9rem; border: 1px solid #2d5b8a; color: #e6e6e6; background: #2d5b8a; cursor: pointer; margin-top: 1.3rem; }
  .flash { padding: 0.6rem 0.9rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; }
  .flash.error { background: #3a1e1e; color: #e3a6a6; }
  .flash.success { background: #1e3a24; color: #a6e3ad; }
</style>
</head>
<body>
  <h1 style="display:flex; align-items:center; gap:0.6rem;"><img src="{{ url_for('static', filename='cadre-logo.png') }}" alt="" width="32" height="32">Cadre</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="post" action="{{ url_for('login') }}">
    <label>username</label>
    <input name="username" required autofocus>
    <label>password</label>
    <input name="password" type="password" required>
    <button class="btn" type="submit">Log in</button>
  </form>
</body>
</html>
